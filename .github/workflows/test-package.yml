name: R Package Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest (R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Install pkgdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::pkgdown
          needs: website

      - name: Validate pkgdown reference index
        run: |
          pkgdown::check_pkgdown(".")
          cat("pkgdown reference index OK\n")
        shell: Rscript {0}

  versebus-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: versebus.R sync check (vs torpmodels)

    steps:
      - name: Checkout torp
        uses: actions/checkout@v7
        with:
          path: torp

      - name: Checkout torpmodels
        uses: actions/checkout@v7
        with:
          repository: peteowen1/torpmodels
          path: torpmodels

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # needs: build (Imports/LinkingTo only, no Suggests/Remotes) -- must
      # NOT resolve torp's full R-CMD-check dependency graph (`needs: check`
      # would also install Suggests/Remotes, including torpmodels from
      # GitHub -- unnecessary network weight for a job whose only job is
      # parsing/diffing two .R files' source text), but every test file's
      # tests/testthat/setup-test-env.R unconditionally does `library(torp)`
      # (testthat::test_file() always sources setup*.R first), so torp's
      # actual Imports must be installed, not just `testthat` itself.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: build
          working-directory: torp

      # setup-r-dependencies installs torp's DEPENDENCIES, not torp itself --
      # setup-test-env.R's library(torp) needs the package actually
      # installed, which devtools::load_all() (the convention used
      # elsewhere in this verse) doesn't provide (it's an attach-into-env
      # shortcut, not a real library() install).
      - name: Install torp
        working-directory: torp
        run: R CMD INSTALL --no-docs --no-byte-compile --no-help .

      # test-versebus-sync.R's own .locate_from_pkg_root() walks "." / ".." /
      # "../.." relative to cwd, matching devtools::test()'s pkg-root cwd when
      # run from here (torp/) with torpmodels/ checked out as a sibling --
      # normally this test skips on CI (no sibling repo present, see its own
      # header comment) but the sibling checkout above makes it actually run.
      - name: Run versebus.R sync check
        working-directory: torp
        run: testthat::test_file("tests/testthat/test-versebus-sync.R", stop_on_failure = TRUE)
        shell: Rscript {0}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          # Patch merge_coverage to skip corrupt trace files (covr subprocess
          # can produce truncated gzip when saveRDS runs out of memory)
          ns <- asNamespace("covr")
          unlockBinding("merge_coverage.character", ns)
          assign("merge_coverage.character", function(x, ...) {
            good <- Filter(function(f) {
              tryCatch({ readRDS(f); TRUE }, error = function(e) {
                message("Skipping corrupt covr trace: ", basename(f))
                FALSE
              })
            }, x)
            if (length(good) == 0) stop("All coverage trace files are corrupt")
            covr:::merge_coverage(lapply(good, function(f) {
              as.list(suppressWarnings(readRDS(f)))
            }))
          }, envir = ns)
          lockBinding("merge_coverage.character", ns)

          # clean = FALSE is load-bearing, not laziness. With clean = TRUE,
          # package_coverage() deletes install_path on the way out -- including
          # testthat.Rout.fail -- so the "Show testthat output" step below found
          # nothing and printed `find: ... No such file or directory`. Four
          # coverage failures between 2026-08-09 and 2026-08-11 reported only
          # "Failure in .../testthat.Rout.fail" with the file already gone, which
          # is why none of them was ever diagnosed. The runner is discarded after
          # the job, so nothing needs cleaning up.
          cov <- covr::package_coverage(
            type = "tests",
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
          covr::codecov(coverage = cov, quiet = FALSE)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
